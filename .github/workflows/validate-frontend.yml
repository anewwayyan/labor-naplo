name: Validate Leletke frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/js/**'
      - 'index.html'
      - '.github/workflows/validate-frontend.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/auth-config.js
