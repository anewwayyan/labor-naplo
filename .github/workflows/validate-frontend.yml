name: Validate frontend

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - '.github/workflows/validate-frontend.yml'
  push:
    branches:
      - feature/profile-frontend
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - '.github/workflows/validate-frontend.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
